name: Build Python Plugins (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - python-plugins
    paths:
      - '.github/workflows/python-plugins-windows.yml'
      - 'Telegram/SourceFiles/ayu/plugins/**'
      - 'Telegram/SourceFiles/ayu/ayu_infra.cpp'
      - 'Telegram/SourceFiles/history/view/history_view_chat_section.cpp'
      - 'Telegram/SourceFiles/boxes/send_files_box.cpp'
      - 'Telegram/Resources/ayu_plugins/**'
      - 'Telegram/cmake/ayu_python_plugins.cmake'
      - 'Telegram/cmake/telegram_options.cmake'

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: tdesktop
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python 3.10 for build scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          architecture: x64

      - name: Remember Python 3.10
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          "PY310=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python 3.11 for plugin runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Remember Python 3.11 and locate MSVC
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          $root = Split-Path -Parent $python
          "PY311=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PY311_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'MSVC v143 14.44 x64/x86 was not found on the runner.'
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify toolchain
        shell: cmd
        run: |
          call "%VCVARS%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cl
          cmake --version
          git --version
          "%PY310%" --version
          "%PY311%" --version

      - name: Create dependency directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty | Out-Null
          New-Item -ItemType Directory -Force -Path Libraries | Out-Null

      - name: Restore prepared dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty
            Libraries
          key: ayugram-win64-${{ hashFiles('tdesktop/Telegram/build/prepare/**', 'tdesktop/Telegram/build/qt_version.py') }}
          restore-keys: |
            ayugram-win64-

      - name: Prepare AyuGram dependencies
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          call "%VCVARS%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          "%PY310%" tdesktop\Telegram\build\prepare\prepare.py silent

      - name: Configure AyuGram with Python plugins
        shell: cmd
        working-directory: ${{ github.workspace }}\tdesktop\Telegram
        run: |
          call "%VCVARS%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          "%PY310%" configure.py x64 -D TDESKTOP_API_TEST=ON -D AYUGRAM_ENABLE_PYTHON_PLUGINS=ON -D Python3_ROOT_DIR="%PY311_ROOT%" -D Python3_EXECUTABLE="%PY311%"

      - name: Build Telegram target
        shell: cmd
        working-directory: ${{ github.workspace }}\tdesktop
        run: |
          call "%VCVARS%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cmake --build out --config Release --target Telegram --parallel 2

      - name: Stage plugin build artifact
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\out\Release'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null

          Get-ChildItem $release -Filter '*.exe' | Copy-Item -Destination $artifact
          if (Test-Path (Join-Path $release 'ayu_plugins')) {
            Copy-Item (Join-Path $release 'ayu_plugins') -Destination $artifact -Recurse
          }

          Copy-Item (Join-Path $env:PY311_ROOT 'python311.dll') -Destination $artifact

          $embedZip = Join-Path $env:RUNNER_TEMP 'python311-embed.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $embedZip
          $pythonHome = Join-Path $artifact 'python311'
          Expand-Archive $embedZip -DestinationPath $pythonHome -Force

          Get-ChildItem $artifact -Recurse | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-python-plugins-windows-x64
          path: artifact
          if-no-files-found: error
          retention-days: 7
